<style>
:root{--red:#B3262E;--red2:#8E1B22;--cream:#FBF3E4;--paper:#FFF9EE;--gold:#C9A24A;--green:#2F6B4F;--ink:#5A3424;--line:#E7D6BC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;overflow-x:hidden}
#app{max-width:460px;margin:0 auto;min-height:100%;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;
 background:radial-gradient(circle at 20% 0%,#fff 0,transparent 40%),var(--cream)}
.snow{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1.4px,transparent 1.6px),radial-gradient(#fff 1px,transparent 1.2px);background-size:46px 46px,29px 29px;background-position:0 0,13px 17px;opacity:.9}
header{text-align:center;position:relative;padding-top:20px}
.eyebrow{font-family:'Cherry Bomb One',sans-serif;font-size:26px;letter-spacing:.02em;color:var(--red);line-height:1.1}
h1{margin:6px 0 4px;font-family:"Zen Maru Gothic","Noto Sans TC",sans-serif;font-weight:900;font-size:26px;letter-spacing:.04em;color:var(--red2)}
.sub{font-size:13.5px;margin:0 0 10px;opacity:.85}
.stage{position:relative;width:100%;aspect-ratio:1;border-radius:22px;background:#1F4A3A;
 box-shadow:0 2px 0 var(--line),0 10px 24px rgba(90,52,36,.12);overflow:hidden;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{margin-top:12px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-size:12px;font-weight:700;width:34px;flex:none;opacity:.7}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;flex:none}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.sz{width:34px;height:30px;border-radius:15px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;cursor:pointer}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz.on{border-color:var(--ink)}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:6px 11px;font:700 13px "Zen Maru Gothic",sans-serif;color:var(--ink);cursor:pointer}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.deco{width:44px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);cursor:pointer;padding:3px;flex:none}
.deco.on{border-color:#C9A24A;box-shadow:0 0 0 2px #E2B84E}
.deco canvas{width:100%;height:100%;display:block}
.cta{display:block;box-sizing:border-box;width:100%;margin-top:14px;padding:14px;border:0;border-radius:30px;background:var(--red);color:#fff;
 font:900 19px "Noto Sans TC",sans-serif;letter-spacing:.1em;box-shadow:0 4px 0 var(--red2);cursor:pointer}
.tip{font-size:12px;text-align:center;opacity:.6;margin-top:8px}

#result{display:none}
.score{text-align:center;margin:12px 0 2px}
.score b{font:400 64px/1 "Dela Gothic One",sans-serif;color:var(--red)}
.score span{font:700 18px "Zen Maru Gothic";margin-left:4px}
.comment{text-align:center;font-weight:700;font-size:16px;margin:4px 0 12px}
.coupon{border:2px dashed var(--gold);border-radius:16px;background:#fff;padding:12px 14px;text-align:center}
.coupon .t{font-size:13px;opacity:.75}
.coupon .c{font:400 28px "Dela Gothic One";letter-spacing:.12em;color:var(--green);margin:4px 0}
.coupon .n{font-size:11.5px;opacity:.65}
#pol{display:block;width:100%;border-radius:12px;box-shadow:0 10px 24px rgba(90,52,36,.18)}
#pol.in{animation:polIn .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes polIn{from{transform:translateY(-60px) rotate(-6deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
#party{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.real{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 12px;cursor:pointer;text-align:left}
.real img{width:64px;height:64px;border-radius:50%;background:#1F4A3A;object-fit:cover;flex:none}
.real b{display:block;font-size:15px;color:var(--red2)}
.real span{font-size:12.5px;opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two .btn{padding:11px;border-radius:24px;font-size:14px}
.sw,.sz,.btn,.deco,.cta,#snd{position:relative}
.cta:disabled{opacity:.55;cursor:default}
/* iPhone 觸感：手指真的點到透明的 switch 開關才會震一下 */
.hap{position:absolute;inset:0;z-index:5;opacity:.011;overflow:hidden;cursor:pointer;margin:0;border-radius:inherit}
.hap input{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;cursor:pointer}
#snd{position:absolute;right:0;top:-6px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:3px 9px;font:700 11.5px "Zen Maru Gothic",sans-serif;color:var(--ink);cursor:pointer;opacity:.85}
#snd.off{opacity:.5}
</style>

const hair=mk(W),hctx=hair.getContext('2d');
function paintHair(){hctx.clearRect(0,0,W,W);hctx.lineCap=hctx.lineJoin='round';
  for(const s of strokes){hctx.globalCompositeOperation=s.erase?'destination-out':'source-over';hctx.strokeStyle=s.c;hctx.lineWidth=s.w;
    hctx.beginPath();s.pts.forEach((p,i)=>i?hctx.lineTo(p[0],p[1]):hctx.moveTo(p[0],p[1]));if(s.pts.length==1)hctx.lineTo(s.pts[0][0]+.1,s.pts[0][1]);hctx.stroke()}
  hctx.globalCompositeOperation='source-over'}
function drawDecos(c,real){decos.forEach((d,i)=>{c.save();c.translate(d.x,d.y);c.rotate(d.r);c.scale(d.s,d.s);DECO[d.k].draw(c,real);c.restore();
  if(!real&&i===sel&&mode=='draw'){c.save();c.translate(d.x,d.y);c.rotate(d.r);c.strokeStyle='rgba(90,52,36,.5)';c.setLineDash([8,8]);c.lineWidth=3;c.strokeRect(-75*d.s,-65*d.s,150*d.s,135*d.s);c.restore();
    const [hx,hy]=handlePos(d);c.save();c.fillStyle='#fff';c.strokeStyle=INK;c.lineWidth=4;c.beginPath();c.arc(hx,hy,24,0,7);c.fill();c.stroke();
    c.lineWidth=4;c.lineCap='round';c.beginPath();c.arc(hx,hy,11,-.3,3.6);c.stroke(); // 旋轉箭頭
    const ex=hx+Math.cos(3.6)*11,ey=hy+Math.sin(3.6)*11;c.beginPath();c.moveTo(ex-6,ey-4);c.lineTo(ex,ey);c.lineTo(ex+5,ey-6);c.stroke();c.restore()}})}
function handlePos(d){const lx=75*d.s,ly=70*d.s;return[d.x+lx*Math.cos(d.r)-ly*Math.sin(d.r),d.y+lx*Math.sin(d.r)+ly*Math.cos(d.r)]}
const hairOut=mk(W),hoctx=hairOut.getContext('2d');
function outlined(){ // 手繪模式：客人的頭髮也加粗黑外框，跟底圖同風格
  hoctx.clearRect(0,0,W,W);hoctx.globalCompositeOperation='source-over';
  for(let k=0;k<20;k++){const a=k/20*6.283;hoctx.drawImage(hair,Math.cos(a)*14,Math.sin(a)*14)}
  hoctx.globalCompositeOperation='source-in';hoctx.fillStyle=INK;hoctx.fillRect(0,0,W,W);
  hoctx.globalCompositeOperation='source-over';hoctx.drawImage(hair,0,0);return hairOut}
function render(){if(mode!='draw')return;paintHair();ctx.clearRect(0,0,W,W);ctx.drawImage(getBase(eyes),0,0);ctx.drawImage(outlined(),0,0);drawDecos(ctx,false)}

const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*W]};
const ptrs=new Map();let cur=null,drag=null,pinch=null,knob=null;
cv.addEventListener('pointerdown',e=>{if(mode!='draw')return;cv.setPointerCapture(e.pointerId);const p=pos(e);ptrs.set(e.pointerId,p);
  if(ptrs.size==2&&sel>=0){cur&&strokes.pop();cur=null;const [a,b]=[...ptrs.values()];const d=decos[sel];pinch={d0:Math.hypot(a[0]-b[0],a[1]-b[1]),a0:Math.atan2(b[1]-a[1],b[0]-a[0]),s:d.s,r:d.r};return}
  // 點到裝飾？
  if(sel>=0){const d=decos[sel],[hx,hy]=handlePos(d);if(Math.hypot(p[0]-hx,p[1]-hy)<42){knob={d0:Math.hypot(p[0]-d.x,p[1]-d.y),a0:Math.atan2(p[1]-d.y,p[0]-d.x),s:d.s,r:d.r};return}}
  for(let i=decos.length-1;i>=0;i--){const d=decos[i];if(Math.abs(p[0]-d.x)<70*d.s&&Math.abs(p[1]-d.y)<65*d.s){sel=i;drag={dx:p[0]-d.x,dy:p[1]-d.y};render();return}}
  if(!strokes.length&&!started){started=true;track('santa_start')}
  sel=-1;cur={c:color,w:size*(erasing?1.6:1),erase:erasing,pts:[p]};strokes.push(cur);lastOps.push('s');render()});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=pos(e);ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size==2){const [a,b]=[...ptrs.values()];const d=decos[sel];d.s=Math.max(.4,Math.min(4,pinch.s*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d0));d.r=pinch.r+Math.atan2(b[1]-a[1],b[0]-a[0])-pinch.a0;render();return}
  if(knob){const d=decos[sel];d.s=Math.max(.4,Math.min(4,knob.s*Math.hypot(p[0]-d.x,p[1]-d.y)/knob.d0));d.r=knob.r+Math.atan2(p[1]-d.y,p[0]-d.x)-knob.a0;render();return}
  if(drag){const d=decos[sel];d.x=p[0]-drag.dx;d.y=p[1]-drag.dy;render();return}
  if(cur){cur.pts.push(p);render()}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){cur=null;drag=null;knob=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  const add=(c,w,pts)=>{strokes.push({c:col||c,w:lw||w,erase:false,pts})};
  const R=rnd(5);
  // 一大朵蓬蓬爆炸頭，長到餅乾外面
  const curl=(cx,cy,r0,w,c)=>{const pts=[];for(let a=0;a<6.6;a+=.2){const rr=r0+a*r0*.11;pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*.85])}add(c,w,pts)};
  for(let k=0;k<=12;k++){const a=Math.PI*(1.08+k*.84/12);curl(500+Math.cos(a)*470,430+Math.sin(a)*420,34,62,'#FFFDF7')}
  for(let k=0;k<=9;k++){const a=Math.PI*(1.12+k*.76/9);curl(500+Math.cos(a)*360,430+Math.sin(a)*320,30,62,'#FFFDF7')}
  for(let k=0;k<=6;k++){const a=Math.PI*(1.2+k*.6/6);curl(500+Math.cos(a)*262,420+Math.sin(a)*232,26,58,'#FFFDF7')}
  decos.push({k:'star',x:770,y:150,s:1.5,r:.4});decos.push({k:'holly',x:220,y:170,s:1.5,r:-.5});decos.push({k:'bow',x:500,y:70,s:1.4,r:0});
  if(n==2)$('bDone').onclick();else render()};
render();
['bDone','bErase','bUndo','bShop','bAgain','bShare','snd'].forEach(id=>addHap($(id)));
$('snd').addEventListener('click',()=>{muted=!muted;$('sndt').textContent=muted?'音效 關':'音效 開';$('snd').classList.toggle('off',muted);$('snd').setAttribute('aria-pressed',String(!muted));if(!muted)SFX.tap()});
// ---------- 活動期間外（正式版）----------
const now=Date.now();
if(LIVE&&(now<EV_START||now>=EV_END)){
  const before=now<EV_START;mode='closed';
  $('sub').textContent=before?'12/3 開始裝扮老公公！畫到 90 分送聖誕千層酥 95 折':'活動已結束，明年見';
  if(!before)$('ttl').textContent='謝謝大家！派對圓滿成功';
  $('draw').querySelector('.tools').style.opacity=.45;$('draw').querySelector('.tools').style.pointerEvents='none';
  const b=$('bDone');b.firstChild.textContent=before?'12/3 開放 ✦':'去看看聖誕千層酥';b.disabled=before;if(!before)b.onclick=()=>{SFX.tap();goProducts()};
  $('draw').querySelector('.tip').style.display='none';
}
if(IN_FRAME)$('app').style.minHeight='0'; // 嵌在官網時高度跟著內容走，外層 iframe 才不會留空白
addEventListener('load',postH);addEventListener('resize',postH);setTimeout(postH,300);
try{new ResizeObserver(postH).observe($('app'))}catch(e){}
})();
